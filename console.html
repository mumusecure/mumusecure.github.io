<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관제 · 무무</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/console.css">
</head>
<body class="console">

<header class="c-top">
  <div class="brand">
    <span class="brand-name">관제</span>
    <span class="brand-sub">MISSION CONTROL</span>
  </div>
  <div class="c-actions">
    <span id="dirty" class="dirty" hidden>변경됨</span>
    <button id="btn-copy" class="ghost">JSON 복사</button>
    <button id="btn-download" class="ghost">내려받기</button>
    <a class="ghost" href="index.html">항해 화면</a>
    <button id="btn-publish" class="primary">발행</button>
  </div>
</header>

<div id="toast" class="toast" hidden></div>

<main class="c-main">

  <section class="card" id="auth-card">
    <div class="card-head">
      <h2>GitHub 연결</h2>
      <span id="auth-state" class="badge">미연결</span>
    </div>
    <p class="hint">
      GitHub Pages에는 서버가 없어서, 이 브라우저가 GitHub API로 직접 커밋한다.
      토큰은 <b>이 브라우저의 localStorage에만</b> 저장되고 어디로도 전송되지 않는다(github.com 제외).
      <br><b>fine-grained PAT</b>를 <code>mumusecure.github.io</code> 저장소 하나에만,
      <code>Contents: Read and write</code> 권한으로 발급할 것. 그 이상은 주지 말 것.
    </p>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
      <button id="btn-token" class="primary">저장</button>
      <button id="btn-forget" class="ghost">삭제</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>성계 — 분야</h2>
      <button id="btn-add-system" class="ghost sm">+ 성계 추가</button>
    </div>
    <div id="systems"></div>
  </section>

</main>

<template id="tpl-body">
  <div class="body-card">
    <div class="body-top">
      <div class="body-id"><span class="ko"></span><span class="en"></span></div>
      <button class="icon del-body" title="천체 삭제">×</button>
    </div>
    <div class="grid">
      <label>표시 이름<input class="f-name" type="text"></label>
      <label>한 줄 목표<input class="f-title" type="text" placeholder="예: 격자 + LLL"></label>
      <label>날짜<input class="f-date" type="date"></label>
    </div>
    <label class="full">설명<textarea class="f-summary" rows="2" placeholder="이 목표에서 무엇을 하는가"></textarea></label>
    <div class="prog">
      <div class="prog-head">
        <span>진행도 — 태양빛을 받는 면적</span>
        <span class="prog-val">0%</span>
      </div>
      <input class="f-progress" type="range" min="0" max="100" step="5" value="0">
      <div class="prog-marks"><span>미확인</span><span>조명 중</span><span>달성</span></div>
    </div>
    <div class="moons-edit">
      <div class="moons-title">위성 — 세부 목표</div>
      <div class="moon-list"></div>
      <div class="moon-suggest"></div>
      <div class="row sm">
        <input class="f-newmoon" type="text" placeholder="위성 이름 직접 입력">
        <button class="ghost sm add-moon">추가</button>
      </div>
    </div>
  </div>
</template>

<script type="module" src="assets/js/console.js"></script>
</body>
</html>
